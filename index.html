<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buzón de Sugerencias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    (function() {
      emailjs.init("J2MUDWB8lPtQXcvUo"); // Reemplaza con tu Public Key
    })();
  </script>
  <style>
    .was-validated .form-control:invalid {
      border-color: #dc3545;
    }

    .was-validated .form-control:valid {
      border-color: #28a745;
    }
  </style>
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div id="alertContainer"></div>
        <div class="card shadow">
          <div class="card-body">
            <h2 class="card-title text-center mb-4">Buzón de Sugerencias</h2>
            <form id="sugerenciaForm" novalidate class="needs-validation">
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre" required>
                <div class="invalid-feedback">Por favor, ingresa tu nombre.</div>
              </div>
              <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="correo" name="correo" placeholder="Tu correo" required>
                <div class="invalid-feedback">Por favor, ingresa un correo válido.</div>
              </div>
              <div class="mb-3">
                <label for="mensaje" class="form-label">Sugerencia</label>
                <textarea class="form-control" id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu sugerencia" required></textarea>
                <div class="invalid-feedback">Por favor, escribe tu sugerencia.</div>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-success">Enviar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('sugerenciaForm');
    const alertContainer = document.getElementById('alertContainer');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      form.classList.add('was-validated');

      if (!form.checkValidity()) {
        return;
      }

      emailjs.sendForm('service_qu1e6pi', 'template_zjwz03p', form)
        .then(function () {
          mostrarAlerta('Sugerencia enviada correctamente.', 'success');
          form.reset();
          form.classList.remove('was-validated');
        }, function (error) {
          console.error('Error al enviar:', error);
          mostrarAlerta('Ocurrió un error al enviar la sugerencia.', 'danger');
        });
    });

    function mostrarAlerta(mensaje, tipo) {
      alertContainer.innerHTML = `
        <div class="alert alert-${tipo} alert-dismissible fade show" role="alert">
          ${mensaje}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
      `;
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
