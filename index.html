<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buzón de Sugerencias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    (function() {
      emailjs.init("J2MUDWB8lPtQXcvUo"); // Reemplaza con tu Public Key
    })();
  </script>
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-body">
            <h2 class="card-title text-center mb-4">Buzón de Sugerencias</h2>
            <form id="sugerenciaForm">
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre" required>
              </div>
              <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="correo" name="correo" placeholder="Tu correo" required>
              </div>
              <div class="mb-3">
                <label for="mensaje" class="form-label">Sugerencia</label>
                <textarea class="form-control" id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu sugerencia" required></textarea>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-success">Enviar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('sugerenciaForm').addEventListener('submit', function(e) {
      e.preventDefault();

      emailjs.sendForm('service_qu1e6pi', 'template_zjwz03p', this)
        .then(function() {
          alert('Sugerencia enviada correctamente');
          document.getElementById('sugerenciaForm').reset();
        }, function(error) {
          console.error('Error al enviar:', error);
          alert('Ocurrió un error al enviar la sugerencia.');
        });
    });
  </script>

</body>
</html>
