<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buzón de Sugerencias</title>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    (function() {
      emailjs.init("J2MUDWB8lPtQXcvUo"); // Reemplaza con tu Public Key
    })();
  </script>
  <style>
    body { font-family: Arial; max-width: 500px; margin: auto; padding-top: 30px; }
    form { display: flex; flex-direction: column; gap: 10px; }
    input, textarea { padding: 10px; font-size: 1rem; }
    button { padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; }
    button:hover { background-color: #218838; }
  </style>
</head>
<body>

  <h2>Buzón de Sugerencias</h2>
  <form id="sugerenciaForm">
    <input type="text" name="nombre" placeholder="Tu nombre" required />
    <input type="email" name="email" placeholder="Tu correo" required />
    <textarea name="mensaje" placeholder="Escribe tu sugerencia" rows="5" required></textarea>
    <button type="submit">Enviar</button>
  </form>

  <script>
    document.getElementById('sugerenciaForm').addEventListener('submit', function(e) {
      e.preventDefault();

      emailjs.sendForm('service_qu1e6pi', 'template_zjwz03p', this)
        .then(function() {
          alert('Sugerencia enviada correctamente');
          document.getElementById('sugerenciaForm').reset();
        }, function(error) {
          console.error('Error al enviar:', error);
          alert('Ocurrió un error al enviar la sugerencia.');
        });
    });
  </script>

</body>
</html>
